<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异能者救赎 · 项目资料库</title>
<style>
:root{
  --bg:#0e1116; --side:#12151b; --panel:#171b22; --panel2:#1b202a;
  --line:#232936; --text:#cfd6e0; --muted:#7d8695;
  --warm:#d9a05b; --cold:#6ea8c9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.8 "Microsoft YaHei","PingFang SC",sans-serif;display:flex;min-height:100vh}
a{color:var(--cold);text-decoration:none}

/* ---------- 侧边栏 ---------- */
aside{width:230px;flex:0 0 230px;background:var(--side);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 0}
.brand{padding:0 24px 20px;border-bottom:1px solid var(--line)}
.brand h1{font:600 20px/1.4 "Noto Serif SC","Songti SC",serif;color:#eef2f7;letter-spacing:2px}
.brand p{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:1px}
nav{flex:1;padding:18px 0}
nav a{display:flex;align-items:center;gap:12px;padding:13px 24px;color:var(--muted);
  font-size:15px;letter-spacing:2px;border-left:3px solid transparent;cursor:pointer;transition:.15s}
nav a:hover{color:var(--text);background:rgba(255,255,255,.03)}
nav a.on{color:var(--warm);border-left-color:var(--warm);background:rgba(217,160,91,.07)}
nav a .ico{width:20px;text-align:center;font-size:16px}
.side-foot{padding:16px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.9}
.side-foot b{color:var(--warm);font-weight:600}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;padding:36px 44px 80px}
section{display:none;max-width:1060px}
section.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.sec-head{margin-bottom:26px}
.sec-head h2{font:600 26px/1.3 "Noto Serif SC",serif;color:#eef2f7;letter-spacing:3px}
.sec-head p{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:1px}

/* 章节切换 */
.ch-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.ch-tab{padding:7px 20px;border:1px solid var(--line);border-radius:99px;background:var(--panel);
  color:var(--muted);font-size:14px;letter-spacing:1px;cursor:pointer;transition:.15s;user-select:none}
.ch-tab:hover{border-color:var(--warm);color:var(--text)}
.ch-tab.on{background:var(--warm);border-color:var(--warm);color:#161310;font-weight:600}
.ch-tab.lock{opacity:.38;cursor:not-allowed}
.ch-tab.lock:hover{border-color:var(--line);color:var(--muted)}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.15s}
.card:hover{border-color:#33405a;transform:translateY(-2px)}
.thumb{aspect-ratio:16/10;background:var(--panel2);display:flex;align-items:center;justify-content:center;
  color:#3d4656;font-size:34px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:.3s}
.thumb img:hover{transform:scale(1.04)}
.thumb .subthumbs{position:absolute;bottom:6px;right:6px;display:flex;gap:4px}
.thumb .subthumbs img{width:44px;height:30px;border:1px solid rgba(255,255,255,.25);border-radius:3px}
.cbody{padding:14px 16px 16px}
.cbody h3{font-size:16px;color:#eef2f7;letter-spacing:1px}
.cbody .tag{font-size:12px;color:var(--cold);margin:2px 0 8px;letter-spacing:1px}
.cbody p{font-size:13px;color:var(--muted);line-height:1.7}
.status{display:inline-block;margin-top:10px;font-size:11px;padding:2px 10px;border-radius:99px;letter-spacing:1px}
.status.done{background:rgba(110,168,201,.14);color:var(--cold);border:1px solid rgba(110,168,201,.3)}
.status.wip{background:rgba(217,160,91,.12);color:var(--warm);border:1px solid rgba(217,160,91,.3)}
.status.todo{background:rgba(125,134,149,.1);color:var(--muted);border:1px solid var(--line)}

/* Markdown 文档 */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:34px 40px}
.doc-src{font-size:12px;color:var(--muted);margin-bottom:18px;letter-spacing:.5px}
.doc-src code{background:var(--panel2);padding:2px 8px;border-radius:4px;color:var(--cold)}
.doc h1{font:600 24px/1.4 "Noto Serif SC",serif;color:#eef2f7;margin:8px 0 14px;letter-spacing:1px}
.doc h2{font:600 20px/1.4 "Noto Serif SC",serif;color:var(--warm);margin:34px 0 12px;letter-spacing:1px}
.doc h3{font-size:17px;color:#e3e9f1;margin:26px 0 10px}
.doc h4{font-size:15px;color:var(--cold);margin:20px 0 8px}
.doc p{margin:10px 0;color:var(--text)}
.doc strong{color:#eef2f7}
.doc hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.doc ul{margin:10px 0 10px 22px}
.doc li{margin:6px 0}
.doc blockquote{border-left:3px solid var(--warm);background:rgba(217,160,91,.06);
  padding:8px 16px;margin:8px 0;color:#e8d9c2;font-size:14px}
.doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;line-height:1.7}
.doc th{background:var(--panel2);color:var(--warm);white-space:nowrap;font-weight:600}
.doc td{color:var(--text)}
.doc tr:hover td{background:rgba(255,255,255,.02)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  padding:70px 20px;text-align:center;color:var(--muted);letter-spacing:2px}
.empty b{display:block;font-size:18px;margin-bottom:8px;color:#4d5666;letter-spacing:3px}

/* 灯箱 */
#lightbox{position:fixed;inset:0;background:rgba(5,7,10,.92);display:none;
  align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:92vw;max-height:90vh;border:1px solid var(--line);border-radius:6px}
#lightbox.on{display:flex}

footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:#4d5666;letter-spacing:1px;max-width:1060px}

@media (max-width:860px){
  body{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;padding:14px 0 0}
  .brand{padding:0 18px 12px}
  nav{display:flex;overflow-x:auto;padding:10px 8px}
  nav a{border-left:none;border-bottom:2px solid transparent;padding:8px 14px;white-space:nowrap}
  nav a.on{border-bottom-color:var(--warm)}
  .side-foot{display:none}
  main{padding:22px 16px 60px}
  .doc{padding:22px 18px}
}
</style>
</head>

<script>
/* --- 极简 Markdown 渲染（标题/表格/列表/引用/粗体/分隔线） --- */
function renderMD(src){
  const lines = src.split(/\r?\n/);
  let html='', i=0, inList=false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const closeList = ()=>{ if(inList){html+='</ul>';inList=false;} };
  while(i<lines.length){
    const line = lines[i], t = line.trim();
    if(!t){ closeList(); i++; continue; }
    if(t.startsWith('|')){
      const rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){
        const l=lines[i].trim();
        if(!/^\|[\s:\-|]+\|$/.test(l)) rows.push(l);
        i++;
      }
      html+='<table>'+rows.map((r,idx)=>{
        const cells=r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
        const tag=idx===0?'th':'td';
        return '<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>';
      }).join('')+'</table>';
      continue;
    }
    const h=t.match(/^(#{1,4})\s+(.*)/);
    if(h){ closeList(); html+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if(/^-{3,}$/.test(t)){ closeList(); html+='<hr>'; i++; continue; }
    if(t.startsWith('>')){ html+=`<blockquote>${inline(t.replace(/^>\s?/,''))}</blockquote>`; i++; continue; }
    const li=t.match(/^-\s+(.*)/);
    if(li){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${inline(li[1])}</li>`; i++; continue; }
    closeList();
    html+=`<p>${inline(t)}</p>`; i++;
  }
  closeList();
  return html;
}

/* --- 卡片网格 --- */
function cardHTML(c){
  const thumbs = c.imgs.length
    ? `<div class="thumb"><img src="${c.imgs[0]}" alt="${c.name}" onclick="zoom('${c.imgs[0]}')">
       ${c.imgs.length>1?`<div class="subthumbs">${c.imgs.slice(1).map(s=>`<img src="${s}" onclick="zoom('${s}')">`).join('')}</div>`:''}</div>`
    : `<div class="thumb">◇</div>`;
  return `<div class="card">${thumbs}
    <div class="cbody"><h3>${c.name}</h3><div class="tag">${c.tag}</div><p>${c.desc}</p>
    <span class="status ${c.status[1]}">${c.status[0]}</span></div></div>`;
}
document.getElementById('char-grid').innerHTML  = CHARACTERS.map(cardHTML).join('');
document.getElementById('scene-grid').innerHTML = SCENES.map(cardHTML).join('');

  box.innerHTML = CHAPTERS.map(c=>
    `<div class="ch-tab ${c.ready?'':'lock'} ${c.n===1?'on':''}" data-n="${c.n}">${c.label}</div>`).join('');
  box.addEventListener('click',e=>{
    const tab=e.target.closest('.ch-tab');
    if(!tab)return;
    box.querySelectorAll('.ch-tab').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
    showChapter(target,+tab.dataset.n);
  });
});
function showChapter(target,n){
  const body=document.getElementById(target+'-body');
  const meta=DOC_META[target][n];
  if(!meta){ body.innerHTML=`<div class="empty"><b>第 ${n} 章</b>尚未开始制作</div>`; return; }
  const md=document.getElementById(meta.mdId).textContent;
  body.innerHTML=`<div class="doc"><div class="doc-src">源文件：<code>${meta.src}</code></div>${renderMD(md)}</div>`;
}
window.addEventListener('DOMContentLoaded',()=>{
  showChapter('scripts',1);
  showChapter('boards',1);
});

document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a)return;
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
  a.classList.add('on');
  document.querySelectorAll('main section').forEach(s=>s.classList.remove('on'));
  document.getElementById('sec-'+a.dataset.sec).classList.add('on');
  window.scrollTo(0,0);
});

const lb=document.getElementById('lightbox');

<script type="text/markdown" id="md-juben-1">
# 《二十》互动影游 · 第一章（序章）《不算人》

**一句话**：在一个异能即人格的世界里，一个没有异能的人，为了一次被当人看的机会，走进一扇铁门。

**本章性质**：线性开篇。三个选择不改变剧情走向，只改变玩家对主角的理解。真正的分支从第二章开始。

**导演优化原则**
- 不解释世界观，只给物证：配给窗口、广告屏、针管、编号、铁门。
- 所有场景都锚在主角的感官上；先给反应，再给对象。
- 三处人群（配给站、街角、铁门）各有分工式反应，不做同质化的背景板。
- 旁白只留下判断句，删掉解释句；能用世界里的声音说的，就不让旁白说。
- 每场从动作中间切入，在情绪落点前切走。

---

## 人物

- **陈默（主角，27）**：无异能者。手粗，指腹有裂口，指甲缝里嵌着灰。替异能明星做替身/影子，收工后脸上还留着夸张的妆。
- **母亲与孩子**：配给站前。母亲全片没有台词，只有一只手。
- **哑嗓男人（40）**：声音像砂纸磨过铁。全场唯一主动说“我想去”的人。
- **白手套（组织人员）**：无表情，只报数字，不给名字，不给正脸。
- **旁白**：低沉、缓慢，只下判断，不解释。

---

## 片头｜黑场·声音

画面全黑。观众先听见世界，再看见世界。

远处空中轨道的低频嗡鸣，持续，像压在耳膜上。

配给窗口的金属台面被推过一声，短促、干涩。风。

极轻的一声——孩子吞咽口水。几乎听不见，但听得见。

十二秒后，画面亮起。

---

## 一、配给站｜日｜外

灰白的天空压着城市，云层很低，光像被什么滤过一遍。高楼之间，空中轨道无声滑过，只有一道影子从楼面掠过，没有声音。

无异能者的队伍贴着墙根排开，人与人的间隔像被量过，一样宽。没人交谈，没人抬头。风把一张废纸吹到队伍脚边，纸在两只鞋之间打转，没人去捡。

配给窗口开在墙上，像一个小孔。一只手从里面伸出来，把一包压缩食物扔到台面上。食物滑了半寸，停住。包装上有一道旧折痕。

陈默伸手，捏住，低头就走，没有看窗口里的人。

队伍旁，一个异能者慢悠悠走过。皮鞋踩过积水，水花溅到旁边无异能者的裤腿上。那人已经习以为常，只是把重心从左脚换到右脚。异能者随手把吃剩的包装丢在地上，包装慢慢沉进积水。

一个六岁左右的孩子蹲下去，手伸向那半个包装。

母亲的手从后面伸来，死死按住孩子的手腕。指节发白。

母亲摇头，嘴唇抿紧，没有出声。她把孩子拉起来，从兜里掏出一个已经揉皱的包装袋，里面是沾了一点霉的面包。她把手上的灰在裤子上抹了抹，擦掉霉，递给孩。

孩子接住，没吃，紧紧攥住母亲的衣角。

孩子抬头。天上，一个异能者掠过天际，衣摆带风，影子从他脸上扫过去。

**旁白**：“异能是天生的。”

配给窗口，一只手把食物推出来，台面发出短促的摩擦声。

**旁白**：“没有的人，是极少数。”

孩子的眼睛。瞳孔里倒映着天空，和那道远去的影子。昏黑的街道上，队伍排得很长，攒动着往前。

**旁白**：“极少数的弱者，不算人。”

（停一秒半，再切。）

### 选择点 1｜孩子伸手的时候

- **别过头**：陈默站着没动，像没看见。母亲的手仍然按住了孩子。
- **上前一步，挡住异能者的视线**：异能者看了陈默一眼，笑了一下，走了。母亲没有道谢，只是把孩子往身后拉了拉。
- **把配给袋递过去**：母亲摇头，没有接。孩子看着陈默，手还攥着母亲的衣角。

三个选项都不改变结果：孩子什么也没捡到。改变的是陈默“还敢不敢伸手”。

---

## 二、天桥下｜夜｜外

全片唯一“暖”的来源，是一块不属于他的广告屏。

巨幅广告屏占满桥洞外的夜空：异能者一家三口，笑容灿烂，灯光温暖。屏幕里的孩子张开手，掌心有一小簇火苗。

屏幕的光漫下来，打在桥下一个缩着的人影上。陈默裹着脏毯子，只露出半张脸。

他面前的积水里，倒映着广告屏的光，光在水面碎成一片一片。一辆浮空车从桥上碾过，积水泼下来，砸在他面前的地上，溅了他一脸。

车没停，尾灯在街角消失。水从他额角往下滴，滴到毯子上，洇开一小块深色。

他的眼睛一直盯着广告屏。

屏幕里，异能者的孩子笑得很开心。桥下，陈默的眼睛一眨不眨。两张相似的脸，不同的悲喜，重合在一起。

**旁白**：“他们看不起我们。”

（停两秒，只留车流声。）

**旁白**：“觉得我们想获得异能，是做梦。”

画面退远。整块广告屏和桥下那个黑点同框。黑点小得几乎看不见。

---

## 三、出租屋｜夜｜内

铁皮门被推开，锈铰链发出一声干涩的响，门在墙上报了一下。

房间窄得转不开身：一张床，一台破电脑，墙角堆着空配给袋，袋子上的字被压得看不清。

桌上有一张皱巴巴的演出结算单，抬头印着“霍骁专场·替身”。旁边是一袋还没拆的卸妆棉。陈默脸上还留着夸张的妆，眼线被汗浸开了一点。

他穿着艳丽的演出服，直接坐下，椅子腿在地面刮了一下，声音很尖。他随手拿起一杯泡面，又停了一下，从桌角把第二只空碗摆到旁边，摆好，又往自己这边挪了挪。

他伸手开电脑。屏幕亮起，蓝光从下往上映在他脸上，把眼窝照出两道阴影。

他转身把开水倒进泡面里，随手拿了个易拉罐压着，翻看电脑。

无异能者论坛，帖子疯转，标题一行行往上滚：

> “通过游戏，获得异能。”
> “薪火的人联系我了。”
> “有没有人知道报名地址？”

发布者：某发明组织。

光标停住。

他点开视频。加载圈转了两秒。

手机画质，竖屏，轻微晃动，有噪点。一个普通人站在白墙前，紧张地攥着拳，指节一下一下松开又攥紧。

镜头外有人低声说了一句什么——听不清内容，只听得出是命令。

那人深吸一口气，肩膀抬起来。下一秒，掌心窜出火焰。火苗先歪了一下，才立住。

陈默把进度条拖回去。火焰再次亮起。又拖回去。又一遍。

鼠标点击声在安静的房间里格外清楚。

屏幕的光在他脸上闪，一次，又一次。他的喉结动了一下。

**旁白**：“直到一个叫‘薪火’的组织，放出了视频。”

### 选择点 2｜视频播放的时候

- **再拖一遍**：他盯着那簇火，像在确认它是真的。鼠标又响了一次。
- **关掉屏幕**：房间黑了。他坐在黑暗里，几秒后，又把屏幕打开。
- **打开评论区**：屏幕上滚过别人的留言——“真的假的”“我也想去”“在哪报名”。他一条一条往下看，没有停。

三个选项都不改变结果：他最后都会去。改变的是他被什么钩住——火、否认、还是别人的希望。

---

## 四、街角｜日｜外

墙根下，几个无异能者围着一部手机。屏幕上是那条视频，正放到掌心起火。

有人低声说话，声音含糊，听不清字。

一个异能者从街对面路过，瞟了一眼，嘴角一扯，嗤笑一声，走了。皮鞋声在巷子里回响。

没人抬头看他。

一个无异能者的手把手机攥紧，指节发白，手机边缘硌进掌心。

**哑嗓男人**（很低）：“……我想去。”

没人接话。

风把地上的塑料袋吹起来，贴着地面走了几步。

旁边有人低着头看着自己的手心，握住又松开，想象自己有异能的样子。有人把手伸进兜里。有人瞥了一眼路过的异能者，紧紧攥拳。

一只手在口袋里慢慢收紧，布料绷出指节的形状。

**旁白**：“异能者嗤之以鼻。”

（停一秒半。）

**旁白**：“我们，趋之若鹜。”

——“趋之若鹜”四个字要轻，不要用力。

---

## 五、筛查点｜日｜外

帐篷外，无异能者排成长队，比配给站的队伍更安静。有人把袖子提前卷到肘上。

针管扎进手臂，皮肤被捏起又松开，暗红血液被抽进试管，试管壁上有细小的气泡。

试管贴上标签，标签上是手写的编号。一只只手把它放进托盘，托盘底垫着白布。

报名者转身离开，表情茫然。有人回头看了一眼帐篷，帐篷帘子落下。

托盘里，试管一排排立着，标签密密麻麻，像一片立起来的墓碑。

**工作人员**（画外）：“抽完血就出去，等通知。”

“等通知”之后，环境声突然抽空半秒。

没有旁白。只有试管碰到托盘的声音。

---

## 六、旧仓库｜日｜外

一扇锈迹斑斑的铁门。门上贴着一张褪色告示，字被雨泡过，只剩轮廓。

门前站了二十个人，稀稀拉拉，间隔很大。没有人站得离另一个人太近。

风卷着废纸从脚边滚过，纸在一个人的鞋边停了一下，又被吹走。

一个男人搓了搓手，又放下，手在裤缝上蹭了蹭。一个女人把衣领拉紧，下巴缩进去。一个年轻人盯着铁门上的锈迹，咽了口唾沫，喉结上下动了一次。

铁门从里面被拉开，发出一声长响，锈屑落下来。

白手套站在门内，扫了一眼，目光在每个人脸上停半秒。

**画外人声**（低声）：“只有这二十个合格吗？”

白手套侧身，伸出手，示意他们走进门里。

二十个人一个接一个走进去。

有人步伐沉稳。有人迫不及待地走在最前面，左顾右盼。有人缩在最后面，警惕地看着周围。有人睥睨地看着周围人，昂首挺胸地走在中间。

门内光线暗，人影一个个被吞进去。

### 选择点 3｜轮到陈默进门的时候

- **回头看一眼天**：天是灰的，什么都没有。他转回来，走进门里。
- **直接走进去**：他没有回头。
- **看哑嗓男人**：哑嗓男人已经进去了，只剩下一个背影。

三个选项都不改变结果：他都会走进那扇门。改变的是他最后看了一眼什么。

铁门关上。门轴的声音很长，最后“咔”一声。

画面最后只剩灰扑扑的外墙、门上那张褪色告示，和四个字——

**“游戏开始。”**

**旁白**：“不，只有一个合格。”

（黑场一秒。）

**字幕**（白字，黑底，停留三秒）：“欢迎来到异能者的世界。”

门锁落下的闷响，在字幕之后，黑场里。

| 1 | 配给站 | 别过头／挡住视线／递配给袋 | 陈默“还敢不敢伸手” |
| 2 | 出租屋 | 再拖一遍／关掉／看评论 | 他被什么钩住：火、否认、别人的希望 |

三个选择都汇合到同一个结果：他走进铁门。第一章不做分支，第二章开始分支。

## 导演优化说明

- **诺兰（信息控制）**：观众直到最后一刻才听见“不，只有一个合格”。前面所有“匹配二十人”的信息都是真的，但只给了一半。观众比陈默早知道，也比陈默多知道一点——这是本章的悬念。
- **斯皮尔伯格（视点与反应）**：所有场景都锚在陈默的感官上。孩子的手、广告屏的光、视频里的火，都是他看见的。先给他的反应，再给对象。
- **黑泽明（群体调度）**：配给站、街角、铁门三处人群，每处都有分工式反应——谁先发现、谁确认、谁犹豫、谁行动、谁维持原态。人群不是背景板。
- **卡梅隆（规则可见化）**：世界的规则不靠旁白解释，靠物证：配给窗口、广告屏、针管、编号、铁门。规则表就是这些物件。
- **昆汀（台词即交易）**：全章台词极少，每句都在办事。工作人员的“抽完血就出去，等通知”是流程，不是解释；哑嗓男人的“我想去”是全场唯一的主动表态。
- **马梅（意义在镜头之间）**：不写“他很难过”，只写他做了什么——捏住食物、低头走、把视频拖回去、喉结动了一下。
- **晚进场、早退场**：每场从动作中间切入，在情绪落点前切走。配给站不给“他回家”的交代；出租屋不给“他决定去”的台词；铁门不给“他为什么去”的解释。

## 与第二章的接口

第一章结束时，陈默刚走进铁门，门锁落下。第二章可以从门内开始：

- 二十个人第一次看见彼此。
- 规则宣告：二十人，一个合格。
- 存钱罐与宝箱。
- 白手套点名，陈默的名字被编号取代。

第一章的三个选择，会在第二章变成三处很小的回声：他伸手与否、他被什么钩住、他最后看了一眼什么。
